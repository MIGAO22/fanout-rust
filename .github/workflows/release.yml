name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            rustarch: x86_64
          - goarch: arm64
            rustarch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装交叉编译器
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.rustarch }}-unknown-linux-gnu
      - name: 打包
        run: |
          mkdir -p dist
          cp target/${{ matrix.rustarch }}-unknown-linux-gnu/release/fanout-rust dist/
          cp README.md LICENSE dist/
          tar -czf fanout-rust-linux-${{ matrix.goarch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-rust-linux-${{ matrix.goarch }}
          path: fanout-rust-linux-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 生成校验和
        run: sha256sum fanout-rust-linux-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fanout-rust-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
