name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 脚本语法
        run: bash -n f.sh install.sh
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 类型检查
        run: |
          set +e
          cargo check --all-targets > /tmp/fanout-check.log 2>&1
          code=$?
          cat /tmp/fanout-check.log
          if [ "$code" -ne 0 ]; then
            {
              echo '### 类型检查失败'
              echo '```log'
              cat /tmp/fanout-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(error(\[E[0-9]+\])?:|error\[E[0-9]+\])' /tmp/fanout-check.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      - name: 单元测试
        run: |
          set +e
          cargo test --all -- --test-threads=1 --nocapture > /tmp/fanout-test.log 2>&1
          code=$?
          cat /tmp/fanout-test.log
          if [ "$code" -ne 0 ]; then
            {
              echo '### 单元测试失败'
              echo '```log'
              cat /tmp/fanout-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: 构建 amd64
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: 交叉编译 arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
