name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 发布前测试
        run: |
          set +e
          cargo test --all -- --test-threads=1 --nocapture > /tmp/fanout-test.log 2>&1
          code=$?
          cat /tmp/fanout-test.log
          if [ "$code" -ne 0 ]; then
            {
              echo '### 发布前测试失败'
              echo '```log'
              cat /tmp/fanout-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            rustarch: x86_64
          - goarch: arm64
            rustarch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: 从标签同步版本号
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "非法版本标签: $RELEASE_TAG"; exit 1; }
          perl -0pi -e "s/^version = \"[^\"]+\"/version = \"$version\"/m" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装交叉编译器
        if: matrix.goarch == 'arm64'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.rustarch }}-unknown-linux-gnu
      - name: 打包
        run: |
          mkdir -p dist
          cp target/${{ matrix.rustarch }}-unknown-linux-gnu/release/fanout-rust dist/
          cp README.md LICENSE install.sh f.sh fanout-rust.service dist/
          tar -czf fanout-rust-linux-${{ matrix.goarch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-rust-linux-${{ matrix.goarch }}
          path: fanout-rust-linux-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 生成校验和
        run: sha256sum fanout-rust-linux-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fanout-rust-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
