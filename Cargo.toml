[package]
name = "fanout-rust"
version = "0.0.5"
edition = "2021"
rust-version = "1.85"
description = "Rust rewrite of fanout: one SOCKS5 port per VPN Gate exit, with the original web UI"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
csv = "1"
subtle = "2"
tokio-util = "0.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
ipnet = "2"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "sched", "signal"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
